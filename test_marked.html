<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<div id="result">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
try {
  console.log('marked version:', marked.VERSION || 'unknown');
  console.log('marked.parse type:', typeof marked.parse);
  
  // Test setOptions
  try {
    marked.setOptions({ breaks: true, gfm: true });
    console.log('setOptions: OK');
  } catch(e) {
    console.log('setOptions ERROR:', e.message);
  }
  
  // Test parse
  try {
    var result = marked.parse('# Hello\n\nThis is **test**\n\n```js\nconsole.log("hi");\n```');
    console.log('parse result length:', result.length);
    console.log('parse preview:', result.substring(0, 200));
    document.getElementById('result').innerHTML = result;
  } catch(e) {
    console.log('parse ERROR:', e.message);
    document.getElementById('result').innerHTML = 'PARSE ERROR: ' + e.message;
  }
} catch(e) {
  document.getElementById('result').innerHTML = 'FATAL ERROR: ' + e.message;
}
</script>
</body>
</html>
