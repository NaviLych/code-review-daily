<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查练习 · 索引</title>
<style>
/* ===== VS Code Dark+ 配色 ===== */
:root {
  --bg-primary:    #1e1e1e;
  --bg-secondary:  #252526;
  --bg-card:       #2d2d2d;
  --bg-card-hover: #333333;
  --bg-badge:      #3c3c3c;
  --border:        #404040;
  --text-primary:  #d4d4d4;
  --text-secondary:#9cdcfe;
  --text-muted:    #808080;
  --accent-blue:   #569cd6;
  --accent-green:  #6a9955;
  --accent-yellow: #dcdcaa;
  --accent-orange: #ce9178;
  --accent-purple: #c586c0;
  --accent-red:    #f44747;
  --accent-cyan:   #4ec9b0;
  --link:          #4fc1ff;
  --link-hover:    #9cdcfe;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== 顶部导航 ===== */
.top-bar {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar .icon { font-size: 20px; }
.top-bar h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-yellow);
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

/* ===== 统计栏 ===== */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 20px 24px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 24px;
  flex: 1;
  min-width: 140px;
  text-align: center;
  transition: border-color 0.2s;
}
.stat-card:hover { border-color: var(--accent-blue); }
.stat-number {
  font-size: 32px;
  font-weight: 700;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  line-height: 1.2;
}
.stat-number.blue   { color: var(--accent-blue); }
.stat-number.green  { color: var(--accent-green); }
.stat-number.purple { color: var(--accent-purple); }
.stat-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ===== 主体内容 ===== */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 40px;
}

/* ===== 分区标题 ===== */
.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-green);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 28px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .comment { color: var(--accent-green); font-family: monospace; }

/* ===== 审查日卡片 ===== */
.review-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: inherit;
}
.review-card:hover {
  border-color: var(--accent-blue);
  transform: translateY(-2px);
}
.review-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.review-card-header .day-tag {
  font-size: 13px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-yellow);
}
.review-card-header .date {
  font-size: 13px;
  color: var(--text-muted);
  font-family: monospace;
}
.lang-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  color: #fff;
  line-height: 1.5;
}
.lang-js    { background: #f0db4f; color: #323330; }
.lang-py    { background: #3776ab; }
.lang-swift { background: #f05138; }
.lang-go    { background: #00add8; color: #1a1a1a; }
.lang-rust  { background: #dea584; color: #1a1a1a; }

.sample-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.sample-name::before {
  content: '▸ ';
  color: var(--accent-blue);
}

.findings {
  list-style: none;
  padding: 0;
}
.findings li {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 3px 0 3px 18px;
  position: relative;
}
.findings li::before {
  content: '•';
  position: absolute;
  left: 4px;
  color: var(--accent-red);
  font-weight: bold;
}
.findings li.good::before {
  content: '✓';
  color: var(--accent-green);
}
.findings li.warn::before {
  content: '⚠';
  color: var(--accent-orange);
}

.card-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.card-link {
  font-size: 12px;
  font-family: monospace;
  color: var(--link);
  text-decoration: none;
  padding: 3px 10px;
  background: var(--bg-badge);
  border-radius: 4px;
  transition: background 0.2s, color 0.2s;
}
.card-link:hover {
  background: var(--accent-blue);
  color: #fff;
}

/* ===== 模式库卡片 ===== */
.pattern-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.pattern-card:hover {
  border-color: var(--accent-purple);
  transform: translateY(-2px);
}
.pattern-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.pattern-info { flex: 1; }
.pattern-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.pattern-desc {
  font-size: 13px;
  color: var(--text-muted);
}
.pattern-count {
  font-size: 28px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-purple);
  flex-shrink: 0;
}
.pattern-count span {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
}

/* ===== 演示文稿卡片 ===== */
.presentation-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.presentation-card:hover {
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
}
.pres-icon {
  font-size: 24px;
  flex-shrink: 0;
}
.pres-info { flex: 1; }
.pres-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.pres-meta {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
}
.pres-arrow {
  font-size: 18px;
  color: var(--accent-cyan);
  transition: transform 0.2s;
}
.presentation-card:hover .pres-arrow {
  transform: translateX(4px);
}

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
.footer code {
  color: var(--accent-green);
  font-family: 'Cascadia Code', monospace;
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .top-bar { padding: 10px 16px; }
  .stats-bar { padding: 14px 16px; gap: 10px; }
  .stat-card { padding: 12px 16px; min-width: 100px; }
  .stat-number { font-size: 24px; }
  .container { padding: 0 16px 30px; }
  .review-card { padding: 16px; }
  .review-card-header { gap: 6px; }
  .pattern-card { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <span class="icon">🔍</span>
  <h1>Code Review Practice</h1>
</div>

<!-- 统计栏 -->
<div class="stats-bar" id="stats"></div>

<!-- 主体 -->
<div class="container" id="main"></div>

<!-- 页脚 -->
<div class="footer" id="footer"></div>

<script>
// =====================================================================
// 📌 数据配置区 —— 新增审查日只需在对应数组中追加对象即可
// =====================================================================

/**
 * 审查日列表（按时间倒序，最新的在最前）
 *
 * 🆕 如何添加新的一天？
 * 1. 复制一个已有条目，修改以下字段：
 *    - day:    "Day3"
 *    - date:   "2026-05-08"
 *    - focus:  今日审查主题一句话
 *    - samples: 数组，每个元素代表一个审查样本
 *        - name:   样本名称
 *        - langs:  语言标签数组，对应 lang-xxx 的 CSS class
 *                  支持: js, py, swift, go, rust, java, ts, c
 *        - findings: 关键发现，2-3 条。加 {good:true} 为好设计标记，
 *                    加 {warn:true} 为警告标记
 *    - md:     审查笔记的 md 文件路径
 *    - html:   演示文稿的 html 文件路径（可选）
 * 2. 保存文件，刷新页面即可
 */
const reviewDays = [
  {
    day: "Day3",
    date: "2026-05-10",
    focus: "并发陷阱：Java DCL & Swift async/await",
    samples: [
      {
        name: "Java DCL & Boolean 锁陷阱",
        langs: ["java"],
        findings: [
          "DCL 无 volatile → 部分构造对象可见",
          "Boolean.FALSE 作为锁与所有缓存用户共享 → 潜在死锁",
          "✅ 修复：synchronized 方法或 Holder 模式"
        ]
      },
      {
        name: "Swift async/await 并发三陷阱",
        langs: ["swift"],
        findings: [
          "串行 await vs 并行 async let 性能差异 3x",
          "Task 隐式捕获 self + 无限序列 → 内存泄漏",
          "Task.detached 脱离 @MainActor 上下文增加复杂度"
        ]
      },
      {
        name: "Java 25 ScopedValue 新特性误用",
        langs: ["java"],
        findings: [
          "⚠ ScopedValue 绑定不传播到 ExecutorService 线程",
          "⚠ .where() 结果未消费，绑定从未激活",
          "✅ 修复：使用 StructuredTaskScope 创建子任务"
        ]
      },
      {
        name: "跨语言并发设计智慧",
        langs: ["java", "swift", "go"],
        findings: [
          {good:true, text:"结构化并发优于 ad-hoc 任务管理"},
          {good:true, text:"轻量级并发 ≠ 自动线程安全"},
          {good:true, text:"上下文传递需要显式机制"}
        ]
      }
    ],
    md: "20260510.md",
    html: "2026-05-10-presentation.html"
  },
  {
    day: "Day2",
    date: "2026-05-07",
    focus: "异步生命周期管理",
    samples: [
      {
        name: "Swift async/await Continuation 泄漏",
        langs: ["swift"],
        findings: [
          "失败路径未 resume continuation → 永久挂起",
          "Task 取消与超时均未处理，delegate 保留环隐患",
          "✅ 修复：所有路径 resume + weak delegate + withTaskCancellationHandler"
        ]
      },
      {
        name: "Go errgroup 结构化并发（好设计）",
        langs: ["go"],
        findings: [
          {good:true, text:"WithContext 传播取消信号，任一失败全部取消"},
          {good:true, text:"SetLimit 控制并发上限，防止资源耗尽"},
          "⚠ 无并发限制时 fan-out 可能打爆下游"
        ]
      },
      {
        name: "Rust Rc 循环引用与 Weak 打破循环",
        langs: ["rust"],
        findings: [
          "Rc/Arc 循环引用绕过编译检查，引用计数永不归零",
          "Weak<T> 打破循环是必须的，编译器无法自动推断",
          "RefCell 运行时 borrow 冲突是另一类隐患"
        ]
      }
    ],
    md: "2026-05-07.md",
    html: "2026-05-07-presentation.html"
  },
  {
    day: "Day1",
    date: "2026-05-06",
    focus: "AI 生成代码的典型陷阱",
    samples: [
      {
        name: "React UserList 组件（AI 生成）",
        langs: ["js"],
        findings: [
          "每次渲染触发 O(n·logn) 全量计算，缺少 useMemo",
          "[...filteredUsers].sort() 中 spread 拷贝多余",
          "缺少防抖、分页、虚拟列表"
        ]
      },
      {
        name: "Claude Code LiteLLM Fallback（真实生产 Bug）",
        langs: ["py"],
        findings: [
          "假设 drop_params=True 会删除参数值，实际只删参数名 → no-op",
          "未验证外部库 MINIMUM_PROMPT_CACHE_TOKEN_COUNT 常量",
          "Runtime 失败，AI 仍声明\"任务完成\""
        ]
      }
    ],
    md: "2026-05-06.md",
    html: null
  }
];

/**
 * 模式库列表
 *
 * 🆕 如何添加新的模式库？
 * 追加一个对象：
 *   - title:   模式库名称
 *   - icon:    emoji 图标
 *   - desc:    简短描述
 *   - count:   当前模式条目数
 *   - file:    md 文件路径
 */
const patternLibs = [
  {
    title: "审查模式库",
    icon: "🔎",
    desc: "AI 生成代码的常见问题模式，供审查时快速识别",
    count: 18,
    file: "审查模式库.md"
  },
  {
    title: "架构模式库",
    icon: "🏗️",
    desc: "好设计与坏设计片段，供架构学习和代码审查参考",
    count: 12,
    file: "架构模式库.md"
  }
];

// =====================================================================
// 渲染逻辑（一般无需修改）
// =====================================================================

/** 渲染统计栏 */
function renderStats() {
  const totalDays = reviewDays.length;
  const totalPatterns = patternLibs.reduce((s, p) => s + p.count, 0);
  const reviewPatterns = patternLibs.find(p => p.title === "审查模式库")?.count || 0;
  const archPatterns = patternLibs.find(p => p.title === "架构模式库")?.count || 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-number blue">${totalDays}</div>
      <div class="stat-label">审查天数</div>
    </div>
    <div class="stat-card">
      <div class="stat-number green">${reviewPatterns}</div>
      <div class="stat-label">审查模式</div>
    </div>
    <div class="stat-card">
      <div class="stat-number purple">${archPatterns}</div>
      <div class="stat-label">架构模式</div>
    </div>
  `;
}

/** 渲染语言 badge */
function langBadge(lang) {
  const map = {
    js: ['JavaScript', 'lang-js'],
    py: ['Python', 'lang-py'],
    swift: ['Swift', 'lang-swift'],
    go: ['Go', 'lang-go'],
    rust: ['Rust', 'lang-rust'],
    java: ['Java', 'lang-py'],
    ts: ['TypeScript', 'lang-js'],
    c: ['C/C++', 'lang-go']
  };
  const [label, cls] = map[lang] || [lang, ''];
  return `<span class="lang-badge ${cls}">${label}</span>`;
}

/** 渲染单条发现 */
function renderFinding(f) {
  if (typeof f === 'string') {
    return `<li>${f}</li>`;
  }
  const cls = f.good ? 'good' : f.warn ? 'warn' : '';
  return `<li class="${cls}">${f.text || f}</li>`;
}

/** 渲染审查日卡片 */
function renderReviewDays() {
  let html = `<div class="section-title"><span class="comment">//</span> 每日审查笔记</div>`;

  reviewDays.forEach(d => {
    // 收集所有语言
    const allLangs = [...new Set(d.samples.flatMap(s => s.langs))];

    let samplesHtml = d.samples.map(s => `
      <div class="sample-name">${s.name}</div>
      <ul class="findings">${s.findings.map(renderFinding).join('')}</ul>
    `).join('');

    let linksHtml = '';
    if (d.md) {
      linksHtml += `<a class="card-link" href="${d.md}">📝 ${d.md}</a>`;
    }
    if (d.html) {
      linksHtml += `<a class="card-link" href="${d.html}">🖥 演示文稿</a>`;
    }

    html += `
      <a class="review-card" href="${d.md || '#'}">
        <div class="review-card-header">
          <span class="day-tag">${d.day}</span>
          <span class="date">${d.date}</span>
          ${allLangs.map(langBadge).join('')}
        </div>
        <div style="font-size:13px;color:var(--accent-orange);margin-bottom:10px;">
          🎯 ${d.focus}
        </div>
        ${samplesHtml}
        <div class="card-footer">${linksHtml}</div>
      </a>
    `;
  });

  return html;
}

/** 渲染模式库卡片 */
function renderPatternLibs() {
  let html = `<div class="section-title"><span class="comment">//</span> 模式库</div>`;

  patternLibs.forEach(p => {
    html += `
      <a class="pattern-card" href="${p.file}">
        <div class="pattern-icon">${p.icon}</div>
        <div class="pattern-info">
          <div class="pattern-title">${p.title}</div>
          <div class="pattern-desc">${p.desc}</div>
        </div>
        <div class="pattern-count">${p.count}<span> 条</span></div>
      </a>
    `;
  });

  return html;
}

/** 渲染演示文稿列表 */
function renderPresentations() {
  const presentations = reviewDays.filter(d => d.html);
  if (presentations.length === 0) return '';

  let html = `<div class="section-title"><span class="comment">//</span> 演示文稿</div>`;

  presentations.forEach(d => {
    html += `
      <a class="presentation-card" href="${d.html}">
        <div class="pres-icon">📊</div>
        <div class="pres-info">
          <div class="pres-title">${d.day} · ${d.focus}</div>
          <div class="pres-meta">${d.html}</div>
        </div>
        <div class="pres-arrow">→</div>
      </a>
    `;
  });

  return html;
}

/** 渲染页脚 */
function renderFooter() {
  const lastDate = reviewDays[0]?.date || '';
  document.getElementById('footer').innerHTML = `
    最后更新：<code>${lastDate}</code> · 
    新增条目只需编辑 <code>&lt;script&gt;</code> 中的 <code>reviewDays</code> 或 <code>patternLibs</code> 数组
  `;
}

// ===== 初始化 =====
(function init() {
  renderStats();
  const main = document.getElementById('main');
  main.innerHTML = renderReviewDays() + renderPatternLibs() + renderPresentations();
  renderFooter();
})();
</script>
</body>
</html>
