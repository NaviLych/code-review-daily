<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查练习 · 索引</title>
<style>
/* ===== VS Code Dark+ 配色 ===== */
:root {
  --bg-primary:    #1e1e1e;
  --bg-secondary:  #252526;
  --bg-card:       #2d2d2d;
  --bg-card-hover: #333333;
  --bg-badge:      #3c3c3c;
  --border:        #404040;
  --text-primary:  #d4d4d4;
  --text-secondary:#9cdcfe;
  --text-muted:    #808080;
  --accent-blue:   #569cd6;
  --accent-green:  #6a9955;
  --accent-yellow: #dcdcaa;
  --accent-orange: #ce9178;
  --accent-purple: #c586c0;
  --accent-red:    #f44747;
  --accent-cyan:   #4ec9b0;
  --link:          #4fc1ff;
  --link-hover:    #9cdcfe;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== 顶部导航 ===== */
.top-bar {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar .icon { font-size: 20px; }
.top-bar h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-yellow);
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

/* ===== 统计栏 ===== */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 20px 24px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 24px;
  flex: 1;
  min-width: 140px;
  text-align: center;
  transition: border-color 0.2s;
}
.stat-card:hover { border-color: var(--accent-blue); }
.stat-number {
  font-size: 32px;
  font-weight: 700;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  line-height: 1.2;
}
.stat-number.blue   { color: var(--accent-blue); }
.stat-number.green  { color: var(--accent-green); }
.stat-number.purple { color: var(--accent-purple); }
.stat-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ===== 主体内容 ===== */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 40px;
}

/* ===== 分区标题 ===== */
.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-green);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 28px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .comment { color: var(--accent-green); font-family: monospace; }

/* ===== 审查日卡片 ===== */
.review-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: inherit;
}
.review-card:hover {
  border-color: var(--accent-blue);
  transform: translateY(-2px);
}
.review-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.review-card-header .day-tag {
  font-size: 13px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-yellow);
}
.review-card-header .date {
  font-size: 13px;
  color: var(--text-muted);
  font-family: monospace;
}
.lang-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  color: #fff;
  line-height: 1.5;
}
.lang-js    { background: #f0db4f; color: #323330; }
.lang-py    { background: #3776ab; }
.lang-swift { background: #f05138; }
.lang-go    { background: #00add8; color: #1a1a1a; }
.lang-rust  { background: #dea584; color: #1a1a1a; }

.sample-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.sample-name::before {
  content: '▸ ';
  color: var(--accent-blue);
}

.findings {
  list-style: none;
  padding: 0;
}
.findings li {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 3px 0 3px 18px;
  position: relative;
}
.findings li::before {
  content: '•';
  position: absolute;
  left: 4px;
  color: var(--accent-red);
  font-weight: bold;
}
.findings li.good::before {
  content: '✓';
  color: var(--accent-green);
}
.findings li.warn::before {
  content: '⚠';
  color: var(--accent-orange);
}

.card-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.card-link {
  font-size: 12px;
  font-family: monospace;
  color: var(--link);
  text-decoration: none;
  padding: 3px 10px;
  background: var(--bg-badge);
  border-radius: 4px;
  transition: background 0.2s, color 0.2s;
}
.card-link:hover {
  background: var(--accent-blue);
  color: #fff;
}

/* ===== 模式库卡片 ===== */
.pattern-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.pattern-card:hover {
  border-color: var(--accent-purple);
  transform: translateY(-2px);
}
.pattern-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.pattern-info { flex: 1; }
.pattern-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.pattern-desc {
  font-size: 13px;
  color: var(--text-muted);
}
.pattern-count {
  font-size: 28px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-purple);
  flex-shrink: 0;
}
.pattern-count span {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
}

/* ===== 演示文稿卡片 ===== */
.presentation-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.presentation-card:hover {
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
}
.pres-icon {
  font-size: 24px;
  flex-shrink: 0;
}
.pres-info { flex: 1; }
.pres-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.pres-meta {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
}
.pres-arrow {
  font-size: 18px;
  color: var(--accent-cyan);
  transition: transform 0.2s;
}
.presentation-card:hover .pres-arrow {
  transform: translateX(4px);
}

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
.footer code {
  color: var(--accent-green);
  font-family: 'Cascadia Code', monospace;
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .top-bar { padding: 10px 16px; }
  .stats-bar { padding: 14px 16px; gap: 10px; }
  .stat-card { padding: 12px 16px; min-width: 100px; }
  .stat-number { font-size: 24px; }
  .container { padding: 0 16px 30px; }
  .review-card { padding: 16px; }
  .review-card-header { gap: 6px; }
  .pattern-card { flex-direction: column; text-align: center; }
}
    .calendar-section {
      margin-bottom: 2rem;
    }
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1rem;
      user-select: none;
    }
    .calendar-nav .nav-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .calendar-nav .nav-arrow:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .calendar-nav .month-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 140px;
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
    }
    .calendar-grid .weekday-header {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .calendar-grid .day-cell {
      position: relative;
      text-align: center;
      padding: 8px 2px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      cursor: default;
      transition: background 0.2s, color 0.2s;
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .calendar-grid .day-cell.other-month {
      color: var(--text-muted);
      opacity: 0.4;
    }
    .calendar-grid .day-cell.has-review {
      color: var(--text-primary);
      cursor: pointer;
      background: rgba(137,180,250,0.06);
      font-weight: 600;
    }
    .calendar-grid .day-cell.has-review:hover {
      background: rgba(137,180,250,0.15);
    }
    .calendar-grid .day-cell.has-review.selected {
      background: rgba(137,180,250,0.22);
      border: 1px solid rgba(137,180,250,0.4);
    }
    .calendar-grid .day-cell.today {
      color: var(--accent-blue);
    }
    .calendar-grid .day-cell .review-dot {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-blue);
    }
    .calendar-grid .day-cell.has-review.selected .review-dot {
      background: var(--accent-blue);
      box-shadow: 0 0 6px var(--accent-blue);
    }

    /* Day detail card */
    .day-detail-card {
      margin-top: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      animation: fadeInUp 0.25s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .day-detail-card .detail-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .day-detail-card .detail-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .day-detail-card .detail-date {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .day-detail-card .detail-samples {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .day-detail-card .detail-sample-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .day-detail-card .detail-sample-prefix {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .day-detail-card .detail-sample-name {
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 500;
    }
    .day-detail-card .detail-findings {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .day-detail-card .detail-finding {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 0.4rem;
    }
    .day-detail-card .detail-finding .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 0.45rem;
      flex-shrink: 0;
    }
    .day-detail-card .detail-finding .dot.red    { background: var(--accent-red); }
    .day-detail-card .detail-finding .dot.yellow { background: var(--accent-yellow); }
    .day-detail-card .detail-finding .dot.green  { background: var(--accent-green); }
    .day-detail-card .detail-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Mobile responsive for calendar */
    @media (max-width: 600px) {
      .calendar-grid {
        gap: 2px;
        padding: 4px;
      }
      .calendar-grid .day-cell {
        padding: 6px 0;
        font-size: 0.78rem;
        min-height: 36px;
      }
      .calendar-grid .weekday-header {
        font-size: 0.65rem;
      }
      .calendar-nav .month-label {
        font-size: 1rem;
      }
    }

</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <span class="icon">🔍</span>
  <h1>Code Review Practice</h1>
</div>

<!-- 统计栏 -->
<div class="stats-bar" id="statsBar"></div>

<!-- 主体 -->
<div class="container">
  <div class="calendar-section">
    <div class="section-title"><span class="icon">📅</span> 审查日历</div>
    <div class="calendar-nav">
      <span class="nav-arrow" onclick="calNav(-1)">◀</span>
      <span class="month-label" id="calMonthLabel"></span>
      <span class="nav-arrow" onclick="calNav(1)">▶</span>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
    <div id="calDetail"></div>
  </div>

  <div class="section-title" onclick="toggleDayCards()" style="cursor:pointer;user-select:none"><span class="icon">📋</span> 全部审查记录 <span id="toggleIcon" style="font-size:0.7em;color:var(--text-muted)">▶ 展开</span></div>
  <div id="dayCards" style="display:none"></div>

  <div class="section-title"><span class="icon">📚</span> 模式库</div>
  <div id="patternCards"></div>

  <div class="section-title"><span class="icon">🎬</span> 演示文稿</div>
  <div id="presentationCards"></div>
</div>

<!-- 页脚 -->
<div class="footer" id="footer"></div>

<script>
// =====================================================================
// 📌 数据配置区 —— 新增审查日只需在对应数组中追加对象即可
// =====================================================================

/**
 * 审查日列表（按时间倒序，最新的在最前）
 *
 * 🆕 如何添加新的一天？
 * 1. 复制一个已有条目，修改以下字段：
 *    - day:    "Day3"
 *    - date:   "2026-05-08"
 *    - focus:  今日审查主题一句话
 *    - samples: 数组，每个元素代表一个审查样本
 *        - name:   样本名称
 *        - langs:  语言标签数组，对应 lang-xxx 的 CSS class
 *                  支持: js, py, swift, go, rust, java, ts, c
 *        - findings: 关键发现，2-3 条。加 {good:true} 为好设计标记，
 *                    加 {warn:true} 为警告标记
 *    - md:     审查笔记的 md 文件路径
 *    - html:   演示文稿的 html 文件路径（可选）
 * 2. 保存文件，刷新页面即可
 */
const reviewDays = [
  {
    day: "Day13",
    date: "2026-05-18",
    focus: "AI编程代码审查审美：真实Bug参考与跨语言雷达",
    samples: [
      {
        name: "LiteLLM适配层契约错位",
        langs: ["py"],
        findings: [
          "🔴 字段名相似不等于语义相同，provider adapter需要capability model",
          "🔴 unsupported params和streaming tool_use不能靠猜",
          {good:true, text:"✅ 好品味：白名单、转换日志、contract tests"}
        ]
      },
      {
        name: "Copilot安全弱点 + 包名幻觉",
        langs: ["js", "py", "go", "rust"],
        findings: [
          "🔴 AI代码常有教程感：流畅但省略生产安全边界",
          "🔴 幻觉依赖看起来像真的，可能变成供应链入口",
          {good:true, text:"✅ 好品味：参数化、安全API、依赖真实性验证"}
        ]
      },
      {
        name: "审美词典：薄、油、虚、硬、稳",
        langs: ["java", "swift", "go", "rust", "ts"],
        findings: [
          "薄：只有happy path，缺少失败路径和资源边界",
          "虚：解释比代码可靠，事实链断裂",
          {good:true, text:"稳：失败可恢复、重试幂等、资源有上限、日志能定位"}
        ]
      }
    ],
    md: "days/20260518.md",
    html: "days/20260518.html"
  },
  {
    day: "Day12",
    date: "2026-05-17",
    focus: "风控批处理、动态 SQL 与线程池资源治理",
    samples: [
      {
        name: "AI生成风控重算任务",
        langs: ["java"],
        findings: [
          "🔴 动态SQL拼接后台参数 → 内部入口也可能SQL注入",
          "🔴 runAsync默认commonPool跑阻塞IO → 线程池与连接池失控",
          "🔴 一次性加载全量交易 → 内存暴涨且失败不可恢复",
          {good:true, text:"✅ 修复：参数化SQL + 分页游标 + batch_id + 隔离线程池"}
        ]
      },
      {
        name: "批处理可恢复性审查",
        langs: ["java"],
        findings: [
          "🔴 无批次表、无失败明细、无last_processed_id",
          "🔴 风控结果直接覆盖主表，缺少risk_version与审计线索",
          "✅ 修复：结果表幂等写入 + 失败明细表 + 断点续跑"
        ]
      },
      {
        name: "今日模式积累",
        langs: ["java"],
        findings: [
          {good:true, text:"默认线程池误用：先问线程从哪来、并发上限是多少"},
          {good:true, text:"批处理不可恢复：成功路径之外，要能知道停在哪、坏在哪、如何重来"},
          {good:true, text:"动态SQL伪内部安全：内部入口也是输入边界"}
        ]
      }
    ],
    md: "days/20260517.md",
    html: null
  },
  {
    day: "Day11",
    date: "2026-05-16",
    focus: "支付回调幂等、事务边界与外部副作用",
    samples: [
      {
        name: "AI生成支付回调处理器",

        findings: [

          {good:true, text:"✅ 修复：trade_no/event_id唯一索引 + 短事务 + outbox"}

      },
      {
        name: "支付链路反向审查",
        langs: ["java"],
        findings: [
          "AI不确定渠道是否只回调一次：应按至少一次投递处理",
          "AI不确定事务是否覆盖外部系统：不能覆盖HTTP副作用",
          "AI不确定状态判断是否足够：最终幂等必须落到数据库约束"
        ]
      },
      {
        name: "今日模式积累",
        langs: ["java"],
        findings: [
          {good:true, text:"状态判断不是幂等"},
          {good:true, text:"事务里夹外部副作用"},
          {good:true, text:"支付确认 + Outbox 架构"}
        ]
      }
    ],
    md: "days/20260516.md",
    html: null
  },
  {
    day: "Day10",
    date: "2026-05-15",
    focus: "Java并发陷阱 & Spring Boot生产级配置误区",

/**
 * 从 reviewDays 构建 dayMap
 * 将 reviewDays 数组转换为 { "2026-05-13": {...} } 格式
 */
function buildDayMap() {
  dayMap = {};
  reviewDays.forEach(function(d) {
    var dateStr = d.date;
    // 从 "Day8" 提取数字 "8"
    var dayNumber = d.day.replace(/[^0-9]/g, '');
    // 从 samples 提取所有 findings 并打平
    var allFindings = [];
    d.samples.forEach(function(sample) {
      sample.findings.forEach(function(f) {
        if (typeof f === 'string') {
          allFindings.push({ type: 'text', text: f });
        } else if (f.good) {
          allFindings.push({ type: 'good', text: f.text });
        } else if (f.warn) {
          allFindings.push({ type: 'warn', text: f.text });
        } else {
          allFindings.push({ type: 'text', text: f.text || String(f) });
        }
      });
    });
    dayMap[dateStr] = {
      dayNumber: dayNumber,
      day: d.day,
      date: dateStr,
      focus: d.focus,
      samples: d.samples,
      findings: allFindings,
      links: {
        md: d.md,
        html: d.html
      }
    };
  });
}

    if (d.md) {

    }
    if (d.html) {
      linksHtml += '<a class="card-link" href="' + d.html + '">🖥 演示文稿</a>';
    }

    html += '<a class="review-card" href="' + (d.md || '#') + '">' +
      '<div class="review-card-header">' +
        '<span class="day-tag">' + d.day + '</span>' +
        '<span class="date">' + d.date + '</span>' +
        allLangs.map(langBadge).join('') +
      '</div>' +
      '<div style="font-size:13px;color:var(--accent-orange);margin-bottom:10px;">🎯 ' + d.focus + '</div>' +
      samplesHtml +
      '<div class="card-footer">' + linksHtml + '</div>' +
    '</a>';
  });

  return html;
}

/** 渲染模式库卡片 */
function renderPatternLibs() {
  var html = '<div class="section-title"><span class="comment">//</span> 模式库</div>';

  patternLibs.forEach(function(p) {
    html += '<a class="pattern-card" href="' + p.file + '">' +
      '<div class="pattern-icon">' + p.icon + '</div>' +
      '<div class="pattern-info">' +
        '<div class="pattern-title">' + p.title + '</div>' +
        '<div class="pattern-desc">' + p.desc + '</div>' +
      '</div>' +
      '<div class="pattern-count">' + p.count + '<span> 条</span></div>' +
    '</a>';
  });

  return html;
}

/** 渲染演示文稿列表 */
function renderPresentations() {
  var presentations = reviewDays.filter(function(d) { return d.html; });
  if (presentations.length === 0) return '';

  var html = '<div class="section-title"><span class="comment">//</span> 演示文稿</div>';

  presentations.forEach(function(d) {
    html += '<a class="presentation-card" href="' + d.html + '">' +
      '<div class="pres-icon">📊</div>' +
      '<div class="pres-info">' +
        '<div class="pres-title">' + d.day + ' · ' + d.focus + '</div>' +
        '<div class="pres-meta">' + d.html + '</div>' +
      '</div>' +
      '<div class="pres-arrow">→</div>' +
    '</a>';
  });

  return html;
}

/** 渲染页脚 */
function renderFooter() {
  var lastDate = reviewDays.length > 0 ? reviewDays[0].date : '';
  document.getElementById('footer').innerHTML = 
    '最后更新：<code>' + lastDate + '</code> · ' +
    '新增条目只需编辑 <code>&lt;script&gt;</code> 中的 <code>reviewDays</code> 或 <code>patternLibs</code> 数组';
}

// =====================================================================
// 日历渲染函数
// =====================================================================

/** 渲染日历网格 */
function renderCalendar() {
  var grid = document.getElementById('calGrid');
  var label = document.getElementById('calMonthLabel');

  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  label.textContent = calYear + '年 ' + monthNames[calMonth];

  var weekdays = ['一','二','三','四','五','六','日'];
  var html = '';
  
  // Weekday headers
  weekdays.forEach(function(w) {
    html += '<div class="weekday-header">' + w + '</div>';
  });

  // First day of the month (0=Sun, 1=Mon, ...)
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  // Convert to Mon-first: Mon=0, Tue=1, ..., Sun=6
  var startOffset = (firstDay + 6) % 7;

  // Days in this month
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  // Previous month days to show
  var prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  // Today's date string
  var today = new Date();
  var todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  // Previous month cells
  for (var i = startOffset - 1; i >= 0; i--) {
    var dayNum = prevMonthDays - i;
    html += '<div class="day-cell other-month">' + dayNum + '</div>';
  }

  // Current month cells
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = calYear + '-' +
      String(calMonth + 1).padStart(2, '0') + '-' +
      String(d).padStart(2, '0');
    var hasReview = !!dayMap[dateStr];
    var isToday = (dateStr === todayStr);
    var isSelected = (dateStr === calSelectedDate);

    var classes = 'day-cell';
    if (hasReview) classes += ' has-review';
    if (isToday) classes += ' today';
    if (isSelected) classes += ' selected';

    var onclick = hasReview ? ' onclick="selectCalendarDate(\'' + dateStr + '\')"' : '';

    html += '<div class="' + classes + '"' + onclick + '>' + d;
    if (hasReview) {
      html += '<span class="review-dot"></span>';
    }
    html += '</div>';
  }

  // Next month cells to fill the last week
  var totalCells = startOffset + daysInMonth;
  var remaining = (7 - (totalCells % 7)) % 7;
  for (var n = 1; n <= remaining; n++) {
    html += '<div class="day-cell other-month">' + n + '</div>';
  }

  grid.innerHTML = html;
}

/** 日历月份导航 */
function calNav(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  calSelectedDate = null;
  document.getElementById('calDetail').innerHTML = '';
  renderCalendar();
}

/** 选择日历日期 */
function selectCalendarDate(dateStr) {
  calSelectedDate = dateStr;
  renderCalendar();
  renderCalendarDetail(dateStr);
}

/** 渲染日历详情卡片 */
function renderCalendarDetail(dateStr) {
  var detail = document.getElementById('calDetail');
  var d = dayMap[dateStr];
  if (!d) { 
    detail.innerHTML = ''; 
    return; 
  }

  // 渲染样本
  var sampleHTML = '';
  d.samples.forEach(function(s) {
    var langsHtml = '';
    s.langs.forEach(function(lang) {
      langsHtml += langBadgeCal(lang);
    });
    sampleHTML += '<div class="detail-sample-item">' +
      '<span class="detail-sample-prefix">▸</span>' +
      '<span class="detail-sample-name">' + s.name + '</span>' +
      langsHtml +
    '</div>';
  });

  // 渲染发现
  var findingHTML = '';
  d.findings.forEach(function(f) {
    var dotClass = 'red';
    if (f.type === 'good') dotClass = 'green';
    else if (f.type === 'warn') dotClass = 'yellow';
    findingHTML += '<div class="detail-finding">' +
      '<span class="dot ' + dotClass + '"></span>' +
      '<span>' + f.text + '</span>' +
    '</div>';
  });

  // 渲染链接
  var mdLink = '<a class="card-link md" href="' + d.links.md + '">📝 MD 笔记</a>';
  var htmlLink = d.links.html ? '<a class="card-link html" href="' + d.links.html + '">🖥️ HTML 演示</a>' : '';

  detail.innerHTML = '<div class="day-detail-card">' +
    '<div class="detail-header">' +
      '<span class="day-badge">' + d.day + '</span>' +
      '<span class="detail-date">' + d.date + '</span>' +
      '<span style="font-size:0.9rem;color:var(--accent-orange);margin-left:auto;">🎯 ' + d.focus + '</span>' +
    '</div>' +
    '<div class="detail-samples">' + sampleHTML + '</div>' +
    '<div class="detail-findings">' + findingHTML + '</div>' +
    '<div class="detail-links">' + mdLink + htmlLink + '</div>' +
  '</div>';
}

/** 初始化日历：定位到最新审查日所在月份 */
function initCalendar() {
  if (reviewDays.length > 0) {
    var lastDate = reviewDays[0].date; // 最新的在最前
    var parts = lastDate.split('-');
    calYear = parseInt(parts[0], 10);
    calMonth = parseInt(parts[1], 10) - 1;
  } else {
    var now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
  }
  renderCalendar();
}

/** 切换日卡片显示/隐藏 */
function toggleDayCards() {
  var el = document.getElementById('dayCards');
  var icon = document.getElementById('toggleIcon');
  if (el.style.display === 'none') {
    el.style.display = 'block';
    icon.textContent = '▼ 收起';
  } else {
    el.style.display = 'none';
    icon.textContent = '▶ 展开';
  }
}

// =====================================================================
// 初始化入口
// =====================================================================

(function init() {
  // 构建日历数据
  buildDayMap();
  
  // 渲染各组件
  renderStats();
  document.getElementById('dayCards').innerHTML = renderReviewDays();
  document.getElementById('patternCards').innerHTML = renderPatternLibs();
  document.getElementById('presentationCards').innerHTML = renderPresentations();
  renderFooter();
  
  // 初始化日历
  initCalendar();
})();
</script>
