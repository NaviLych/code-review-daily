<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查练习 · 索引</title>
<style>
/* ===== VS Code Dark+ 配色 ===== */
:root {
  --bg-primary:    #1e1e1e;
  --bg-secondary:  #252526;
  --bg-card:       #2d2d2d;
  --bg-card-hover: #333333;
  --bg-badge:      #3c3c3c;
  --border:        #404040;
  --text-primary:  #d4d4d4;
  --text-secondary:#9cdcfe;
  --text-muted:    #808080;
  --accent-blue:   #569cd6;
  --accent-green:  #6a9955;
  --accent-yellow: #dcdcaa;
  --accent-orange: #ce9178;
  --accent-purple: #c586c0;
  --accent-red:    #f44747;
  --accent-cyan:   #4ec9b0;
  --link:          #4fc1ff;
  --link-hover:    #9cdcfe;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== 顶部导航 ===== */
.top-bar {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar .icon { font-size: 20px; }
.top-bar h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-yellow);
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

/* ===== 统计栏 ===== */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 20px 24px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 24px;
  flex: 1;
  min-width: 140px;
  text-align: center;
  transition: border-color 0.2s;
}
.stat-card:hover { border-color: var(--accent-blue); }
.stat-number {
  font-size: 32px;
  font-weight: 700;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  line-height: 1.2;
}
.stat-number.blue   { color: var(--accent-blue); }
.stat-number.green  { color: var(--accent-green); }
.stat-number.purple { color: var(--accent-purple); }
.stat-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ===== 主体内容 ===== */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 40px;
}

/* ===== 分区标题 ===== */
.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-green);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 28px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .comment { color: var(--accent-green); font-family: monospace; }

/* ===== 审查日卡片 ===== */
.review-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: inherit;
}
.review-card:hover {
  border-color: var(--accent-blue);
  transform: translateY(-2px);
}
.review-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.review-card-header .day-tag {
  font-size: 13px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-yellow);
}
.review-card-header .date {
  font-size: 13px;
  color: var(--text-muted);
  font-family: monospace;
}
.lang-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  color: #fff;
  line-height: 1.5;
}
.lang-js    { background: #f0db4f; color: #323330; }
.lang-py    { background: #3776ab; }
.lang-swift { background: #f05138; }
.lang-go    { background: #00add8; color: #1a1a1a; }
.lang-rust  { background: #dea584; color: #1a1a1a; }

.sample-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.sample-name::before {
  content: '▸ ';
  color: var(--accent-blue);
}

.findings {
  list-style: none;
  padding: 0;
}
.findings li {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 3px 0 3px 18px;
  position: relative;
}
.findings li::before {
  content: '•';
  position: absolute;
  left: 4px;
  color: var(--accent-red);
  font-weight: bold;
}
.findings li.good::before {
  content: '✓';
  color: var(--accent-green);
}
.findings li.warn::before {
  content: '⚠';
  color: var(--accent-orange);
}

.card-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.card-link {
  font-size: 12px;
  font-family: monospace;
  color: var(--link);
  text-decoration: none;
  padding: 3px 10px;
  background: var(--bg-badge);
  border-radius: 4px;
  transition: background 0.2s, color 0.2s;
}
.card-link:hover {
  background: var(--accent-blue);
  color: #fff;
}

/* ===== 模式库卡片 ===== */
.pattern-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.pattern-card:hover {
  border-color: var(--accent-purple);
  transform: translateY(-2px);
}
.pattern-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.pattern-info { flex: 1; }
.pattern-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.pattern-desc {
  font-size: 13px;
  color: var(--text-muted);
}
.pattern-count {
  font-size: 28px;
  font-weight: 700;
  font-family: 'Cascadia Code', monospace;
  color: var(--accent-purple);
  flex-shrink: 0;
}
.pattern-count span {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
}

/* ===== 演示文稿卡片 ===== */
.presentation-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.15s;
}
.presentation-card:hover {
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
}
.pres-icon {
  font-size: 24px;
  flex-shrink: 0;
}
.pres-info { flex: 1; }
.pres-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.pres-meta {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
}
.pres-arrow {
  font-size: 18px;
  color: var(--accent-cyan);
  transition: transform 0.2s;
}
.presentation-card:hover .pres-arrow {
  transform: translateX(4px);
}

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
.footer code {
  color: var(--accent-green);
  font-family: 'Cascadia Code', monospace;
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .top-bar { padding: 10px 16px; }
  .stats-bar { padding: 14px 16px; gap: 10px; }
  .stat-card { padding: 12px 16px; min-width: 100px; }
  .stat-number { font-size: 24px; }
  .container { padding: 0 16px 30px; }
  .review-card { padding: 16px; }
  .review-card-header { gap: 6px; }
  .pattern-card { flex-direction: column; text-align: center; }
}
    .calendar-section {
      margin-bottom: 2rem;
    }
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1rem;
      user-select: none;
    }
    .calendar-nav .nav-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .calendar-nav .nav-arrow:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .calendar-nav .month-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 140px;
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
    }
    .calendar-grid .weekday-header {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .calendar-grid .day-cell {
      position: relative;
      text-align: center;
      padding: 8px 2px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      cursor: default;
      transition: background 0.2s, color 0.2s;
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .calendar-grid .day-cell.other-month {
      color: var(--text-muted);
      opacity: 0.4;
    }
    .calendar-grid .day-cell.has-review {
      color: var(--text-primary);
      cursor: pointer;
      background: rgba(137,180,250,0.06);
      font-weight: 600;
    }
    .calendar-grid .day-cell.has-review:hover {
      background: rgba(137,180,250,0.15);
    }
    .calendar-grid .day-cell.has-review.selected {
      background: rgba(137,180,250,0.22);
      border: 1px solid rgba(137,180,250,0.4);
    }
    .calendar-grid .day-cell.today {
      color: var(--accent-blue);
    }
    .calendar-grid .day-cell .review-dot {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-blue);
    }
    .calendar-grid .day-cell.has-review.selected .review-dot {
      background: var(--accent-blue);
      box-shadow: 0 0 6px var(--accent-blue);
    }

    /* Day detail card */
    .day-detail-card {
      margin-top: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      animation: fadeInUp 0.25s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .day-detail-card .detail-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .day-detail-card .detail-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .day-detail-card .detail-date {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .day-detail-card .detail-samples {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .day-detail-card .detail-sample-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .day-detail-card .detail-sample-prefix {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .day-detail-card .detail-sample-name {
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 500;
    }
    .day-detail-card .detail-findings {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .day-detail-card .detail-finding {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 0.4rem;
    }
    .day-detail-card .detail-finding .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 0.45rem;
      flex-shrink: 0;
    }
    .day-detail-card .detail-finding .dot.red    { background: var(--accent-red); }
    .day-detail-card .detail-finding .dot.yellow { background: var(--accent-yellow); }
    .day-detail-card .detail-finding .dot.green  { background: var(--accent-green); }
    .day-detail-card .detail-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Mobile responsive for calendar */
    @media (max-width: 600px) {
      .calendar-grid {
        gap: 2px;
        padding: 4px;
      }
      .calendar-grid .day-cell {
        padding: 6px 0;
        font-size: 0.78rem;
        min-height: 36px;
      }
      .calendar-grid .weekday-header {
        font-size: 0.65rem;
      }
      .calendar-nav .month-label {
        font-size: 1rem;
      }
    }

</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <span class="icon">🔍</span>
  <h1>Code Review Practice</h1>
</div>

<!-- 统计栏 -->
<div class="stats-bar" id="statsBar"></div>

<!-- 主体 -->
<div class="container">
  <div class="calendar-section">
    <div class="section-title"><span class="icon">📅</span> 审查日历</div>
    <div class="calendar-nav">
      <span class="nav-arrow" onclick="calNav(-1)">◀</span>
      <span class="month-label" id="calMonthLabel"></span>
      <span class="nav-arrow" onclick="calNav(1)">▶</span>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
    <div id="calDetail"></div>
  </div>

  <div class="section-title" onclick="toggleDayCards()" style="cursor:pointer;user-select:none"><span class="icon">📋</span> 全部审查记录 <span id="toggleIcon" style="font-size:0.7em;color:var(--text-muted)">▶ 展开</span></div>
  <div id="dayCards" style="display:none"></div>

  <div class="section-title"><span class="icon">📚</span> 模式库</div>
  <div id="patternCards"></div>

  <div class="section-title"><span class="icon">🎬</span> 演示文稿</div>
  <div id="presentationCards"></div>
</div>

<!-- 页脚 -->
<div class="footer" id="footer"></div>

<script>
// =====================================================================
// 📌 数据配置区 —— 新增审查日只需在对应数组中追加对象即可
// =====================================================================

/**
 * 审查日列表（按时间倒序，最新的在最前）
 *
 * 🆕 如何添加新的一天？
 * 1. 复制一个已有条目，修改以下字段：
 *    - day:    "Day3"
 *    - date:   "2026-05-08"
 *    - focus:  今日审查主题一句话
 *    - samples: 数组，每个元素代表一个审查样本
 *        - name:   样本名称
 *        - langs:  语言标签数组，对应 lang-xxx 的 CSS class
 *                  支持: js, py, swift, go, rust, java, ts, c
 *        - findings: 关键发现，2-3 条。加 {good:true} 为好设计标记，
 *                    加 {warn:true} 为警告标记
 *    - md:     审查笔记的 md 文件路径
 *    - html:   演示文稿的 html 文件路径（可选）
 * 2. 保存文件，刷新页面即可
 */
const reviewDays = [
  {
    day: "Day8",
    date: "2026-05-13",
    focus: "跨语言错误处理与并发安全",
    samples: [
      {
        name: "Rust crossbeam-channel Double-Free",
        langs: ["rust"],
        findings: [
          "🔴 Channel 初始化两步操作存在竞态窗口",
          "head=tail=null 时内部状态不一致",
          "Rust 所有权优秀，但并发析构仍可突破安全边界"
        ]
      },
      {
        name: "Go 错误变量遮蔽",
        langs: ["go"],
        findings: [
          "🔴 for 循环内 err:= 遮蔽外层 err",
          "循环终止后检查的仍是初始 nil",
          "✅ 修复：用 err= 赋值而非 err:= 声明"
        ]
      },
      {
        name: "TypeScript as any 滥用",
        langs: ["ts"],
        findings: [
          "🔴 类型断言到 any 绕过编译检查",
          "API 返回意外结构时运行时崩溃",
          "✅ 修复：定义接口 + 类型守卫 unknown+isX"
        ]
      },
      {
        name: "跨语言错误处理模式对比",
        langs: ["go", "rust", "ts", "swift"],
        findings: [
          {good:true, text:"错误是值，不是异常"},
          {good:true, text:"向上传播时用包装器添加上下文"},
          {good:true, text:"统一错误响应：error→HTTP status mapping"}
        ]
      }
    ],
    md: "days/20260513.md",
    html: "days/20260513.html"
  },
  {
    day: "Day7",
    date: "2026-05-12",
    focus: "跨语言设计模式：泛型、并发与内存管理",
    samples: [
      {
        name: "AI生成代码Bug分类（来源：arxiv:2407.06153）",
        langs: ["py", "go", "rust"],
        findings: [
          "语义错误（逻辑/算法）+ 语法错误（格式/类型）+ 运行时错误（空指针/溢出/泄漏）",
          "AI倾向于生成更短但更复杂的代码，通过单元测试≠代码质量",
          "✅ self-critique后pass rate提升29.2%"
        ]
      },
      {
        name: "Go vs Rust 并发模型对比",
        langs: ["go", "rust"],
        findings: [
          "Go: CSP模型 + Goroutine/Channel，数据竞争在运行时检测",
          "Rust: 所有权 + async/await，编译期防止数据竞争",
          {good:true, text:"核心启示：安全 vs 性能的权衡，场景决定选择"}
        ]
      },
      {
        name: "TypeScript泛型设计模式",
        langs: ["ts"],
        findings: [
          "泛型工厂: <T extends Shape> + new() => T 确保类型安全",
          "泛型观察者: <T> 约束update参数类型，编译期捕获错误",
          {good:true, text:"跨语言对比：TS/Go/Swift 接口抽象模式一致"}
        ]
      }
    ],
    md: "days/20260512.md",
    html: "days/20260512.html"
  },
  {
    day: "Day6",
    date: "2026-05-11",
    focus: "跨语言架构设计与性能反模式",
    samples: [
      {
        name: "Swift VIPER 架构（好设计）",
        langs: ["swift"],
        findings: [
          "协议抽象 + 依赖注入 → Mock 测试轻而易举",
          "职责边界清晰：View/Presenter/Interactor/Router/Entity",
          {good:true, text:"可测试性驱动设计"}
        ]
      },
      {
        name: "React 渲染内重复计算（反模式）",
        langs: ["js"],
        findings: [
          "🔴 useMemo 缺失：每次渲染触发 O(n·logn) 完整重算",
          "1000 条数据下帧率骤降 (5-8ms/次)",
          "AI 最可能隐瞒：不提缓存、不提清理、不提边界"
        ]
      },
      {
        name: "WebSocket 内存泄漏（反模式）",
        langs: ["js"],
        findings: [
          "🔴 组件卸载时连接永不关闭",
          "roomId 变化时多个连接同时存活",
          "🔴 无重连机制"
        ]
      }
    ],
    md: "days/2026-05-11.md",
    html: "days/2026-05-11-presentation.html"
  },
  {
    day: "Day5",
    date: "2026-05-10",
    focus: "AI生成代码的典型缺陷：Spring Security·Stream·并发·Swift async/await·Java 25 ScopedValue",
    samples: [
      {
        name: "Java/Spring Boot 废弃 API 三陷阱",
        langs: ["java"],

/** 渲染语言 badge */
function langBadge(lang) {
  const map = {
    js: ['JavaScript', 'lang-js'],
    py: ['Python', 'lang-py'],
    swift: ['Swift', 'lang-swift'],
    go: ['Go', 'lang-go'],
    rust: ['Rust', 'lang-rust'],
    java: ['Java', 'lang-py'],
    ts: ['TypeScript', 'lang-js'],
    c: ['C/C++', 'lang-go']
  };
  const [label, cls] = map[lang] || [lang, ''];
  return `<span class="lang-badge ${cls}">${label}</span>`;
}

/** 渲染单条发现 */
function renderFinding(f) {
  if (typeof f === 'string') {
    return `<li>${f}</li>`;
  }
  const cls = f.good ? 'good' : f.warn ? 'warn' : '';
  return `<li class="${cls}">${f.text || f}</li>`;
}

/** 渲染审查日卡片 */
function renderReviewDays() {
  let html = `<div class="section-title"><span class="comment">//</span> 每日审查笔记</div>`;

  reviewDays.forEach(d => {
    // 收集所有语言
    const allLangs = [...new Set(d.samples.flatMap(s => s.langs))];

    let samplesHtml = d.samples.map(s => `
      <div class="sample-name">${s.name}</div>
      <ul class="findings">${s.findings.map(renderFinding).join('')}</ul>
    `).join('');

    let linksHtml = '';
    if (d.md) {
      linksHtml += `<a class="card-link" href="${d.md}">📝 ${d.md}</a>`;
    }
    if (d.html) {
      linksHtml += `<a class="card-link" href="${d.html}">🖥 演示文稿</a>`;
    }

    html += `
      <a class="review-card" href="${d.md || '#'}">
        <div class="review-card-header">
          <span class="day-tag">${d.day}</span>
          <span class="date">${d.date}</span>
          ${allLangs.map(langBadge).join('')}
        </div>
        <div style="font-size:13px;color:var(--accent-orange);margin-bottom:10px;">
          🎯 ${d.focus}
        </div>
        ${samplesHtml}
        <div class="card-footer">${linksHtml}</div>
      </a>
    `;
  });

  return html;
}

function renderCalendar() {
  var grid = document.getElementById('calGrid');
  var label = document.getElementById('calMonthLabel');

  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  label.textContent = calYear + '年 ' + monthNames[calMonth];

  var weekdays = ['一','二','三','四','五','六','日'];
  var html = '';
  // Weekday headers
  weekdays.forEach(function(w) {
    html += '<div class="weekday-header">' + w + '</div>';
  });

  // First day of the month (0=Sun, 1=Mon, ...)
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  // Convert to Mon-first: Mon=0, Tue=1, ..., Sun=6
  var startOffset = (firstDay + 6) % 7;

  // Days in this month
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  // Previous month days to show
  var prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  var today = new Date();
  var todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  // Previous month cells
  for (var i = startOffset - 1; i >= 0; i--) {
    var dayNum = prevMonthDays - i;
    html += '<div class="day-cell other-month">' + dayNum + '</div>';
  }

  // Current month cells
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = calYear + '-' +
      String(calMonth + 1).padStart(2, '0') + '-' +
      String(d).padStart(2, '0');
    var hasReview = !!dayMap[dateStr];
    var isToday = (dateStr === todayStr);
    var isSelected = (dateStr === calSelectedDate);

    var classes = 'day-cell';
    if (hasReview) classes += ' has-review';
    if (isToday) classes += ' today';
    if (isSelected) classes += ' selected';

    var onclick = hasReview ? ' onclick="selectCalendarDate(\'' + dateStr + '\')"' : '';

    html += '<div class="' + classes + '"' + onclick + '>' + d;
    if (hasReview) {
      html += '<span class="review-dot"></span>';
    }
    html += '</div>';
  }

  // Next month cells to fill the last week
  var totalCells = startOffset + daysInMonth;
  var remaining = (7 - (totalCells % 7)) % 7;
  for (var n = 1; n <= remaining; n++) {
    html += '<div class="day-cell other-month">' + n + '</div>';
  }

  grid.innerHTML = html;
}

function calNav(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  calSelectedDate = null;
  document.getElementById('calDetail').innerHTML = '';
  renderCalendar();
}

function selectCalendarDate(dateStr) {
  calSelectedDate = dateStr;
  renderCalendar();
  renderCalendarDetail(dateStr);
}

function renderCalendarDetail(dateStr) {
  var detail = document.getElementById('calDetail');
  var d = dayMap[dateStr];
  if (!d) { detail.innerHTML = ''; return; }

  var sampleHTML = d.samples.map(function(s) {
    return '<div class="detail-sample-item">' +
      '<span class="detail-sample-prefix">▸</span>' +
      '<span class="detail-sample-name">' + s.name + '</span>' +
      langTag(s.lang) +
      '</div>';
  }).join('');

  var findingHTML = d.findings.map(function(f) {
    return '<div class="detail-finding"><span class="dot ' + f.severity + '"></span><span>' + f.text + '</span></div>';
  }).join('');

  var mdLink = '<a class="card-link md" onclick="openReader(\'' + d.links.md + '\'); return false;">📝 MD 笔记</a>';
  var htmlLink = d.links.html ? '<a class="card-link html" href="' + d.links.html + '">🖥️ HTML 演示</a>' : '';

  detail.innerHTML = '<div class="day-detail-card">' +
    '<div class="detail-header">' +
      '<span class="day-badge">Day ' + d.dayNumber + '</span>' +
      '<span class="detail-date">' + d.date + '</span>' +
    '</div>' +
    '<div class="detail-samples">' + sampleHTML + '</div>' +
    '<div class="detail-findings">' + findingHTML + '</div>' +
    '<div class="detail-links">' + mdLink + htmlLink + '</div>' +
    '</div>';
}

(function initCalendar() {
  if (days.length > 0) {

  renderCalendar();
